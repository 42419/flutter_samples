
name: Build OHOS HAP from GitCode

on:
  workflow_dispatch:
    inputs:
      sample_dir:
        description: "示例目录名，如 flutter_music_player / channel_demo"
        required: true
        default: "flutter_music_player"
      samples_branch:
        description: "samples 分支"
        default: "master"
      target_platform:
        description: "目标架构：ohos-x64（DevEco 模拟器）/ ohos-arm64（真机）"
        default: "ohos-x64"
      flutter_ref:
        description: "flutter_flutter 分支/标签"
        default: "oh-3.41.9-release"

env:
  NPM_CONFIG_FROZEN_LOCKFILE: "false"
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
  FLUTTER_OHOS_STORAGE_BASE_URL: https://flutter-ohos.obs.cn-south-1.myhuaweicloud.com
  FLUTTER_GIT_URL: https://gitcode.com/CPF-Flutter/flutter_flutter.git

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ============================================================
      # 1. 获取源码
      # ============================================================

      - name: Clone flutter_samples (GitCode)
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 -b "${{ inputs.samples_branch }}" \
            https://gitcode.com/CPF-Flutter/flutter_samples.git samples

      - name: Clone flutter_flutter (GitCode)
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 -b "${{ inputs.flutter_ref }}" \
            https://gitcode.com/CPF-Flutter/flutter_flutter.git flutter_flutter

      # ============================================================
      # 2. 修补 Flutter OHOS SDK 校验
      # 必须在任何 Flutter 命令之前
      # ============================================================

      - name: Patch flutter_tools SDK validation
        shell: bash
        run: |
          set -euo pipefail

          F="flutter_flutter/packages/flutter_tools/lib/src/ohos/ohos_sdk.dart"

          echo "==== 补丁前 ===="
          grep -n "static bool valid" "$F" || true

          awk '
            /static bool valid(SdkDirectory|Api1[01]SdkDirectory)/ {
              print
              print "    return true; // CI patch: bypass strict SDK dir check"
              next
            }
            { print }
          ' "$F" > "$F.tmp"

          mv "$F.tmp" "$F"

          echo "==== 补丁后 ===="
          grep -n "CI patch" "$F" || true

          COUNT=$(grep -c "CI patch" "$F" || true)

          echo "注入数量: $COUNT"

          if [ "$COUNT" -lt 4 ]; then
            echo "::error::SDK 校验补丁未完整命中"
            exit 1
          fi

      # ============================================================
      # 3. 安装基础环境
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"

      - name: Install ohpm shim and Hvigor
        shell: bash
        run: |
          set -euo pipefail

          npm config set registry https://repo.huaweicloud.com/repository/npm/
          npm config set @ohos:registry https://repo.harmonyos.com/npm/

          echo "frozen-lockfile=false" >> "$HOME/.npmrc"

          echo "==== npm 配置 ===="
          npm config get registry
          npm config get @ohos:registry

          # ohpm shim
          # 注意：这里仅跳过 ohpm 安装，不能代替真实 ohpm。
          mkdir -p "$HOME/ohpm-shim"

          cat > "$HOME/ohpm-shim/ohpm" <<'SH'
          #!/usr/bin/env bash

          case "${1:-}" in
            install)
              echo "[ohpm shim] install $* — skipped"
              exit 0
              ;;
            config|list|version|-v|--version)
              echo "ohpm-shim 1.0.0"
              exit 0
              ;;
            *)
              echo "[ohpm shim] passthrough-noop: $*"
              exit 0
              ;;
          esac
          SH

          chmod +x "$HOME/ohpm-shim/ohpm"

          echo "$HOME/ohpm-shim" >> "$GITHUB_PATH"
          export PATH="$HOME/ohpm-shim:$PATH"

          ohpm --version

          # 安装全局 Hvigor，作为备用工具
          npm install -g @ohos/hvigor@6.26.9

          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
          export PATH="$(npm prefix -g)/bin:$PATH"

          echo "==== Node ===="
          node -v

          echo "==== npm ===="
          npm -v

          echo "==== 全局 Hvigor ===="
          hvigor --version || true

      # ============================================================
      # 4. 获取 HarmonyOS SDK
      # ============================================================

      - name: Query OHOS SDK URL
        id: sdk
        shell: bash
        run: |
          set -euo pipefail

          query_component() {
            local component="$1"

            curl -fsSL \
              'https://dcp.openharmony.cn/api/daily_build/build/list/component' \
              -H 'Accept: application/json, text/plain, */*' \
              -H 'Content-Type: application/json' \
              --data-raw '{
                "projectName":"openharmony",
                "branch":"master",
                "pageNum":1,
                "pageSize":10,
                "deviceLevel":"",
                "component":"'"${component}"'",
                "type":1,
                "startTime":"2025010100000000",
                "endTime":"20990101235959",
                "sortType":"",
                "sortField":"",
                "hardwareBoard":"",
                "buildStatus":"success",
                "buildFailReason":"",
                "withDomain":1
              }'
          }

          query_component "ohos-sdk-public" > /tmp/pub.json

          URL=$(jq -r '.data.list.dataList[0].obsPath // empty' /tmp/pub.json)

          if [ -z "$URL" ]; then
            query_component "ohos-sdk-full" > /tmp/full.json
            URL=$(jq -r '.data.list.dataList[0].obsPath // empty' /tmp/full.json)
          fi

          if [ -z "$URL" ]; then
            echo "::error::未能解析出 SDK 下载地址"
            exit 1
          fi

          VER=$(echo "$URL" |
            sed -E 's|.*/Daily_Version/||; s|/[^/]+$||; s|/|_|g')

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

          echo "SDK URL: $URL"
          echo "CacheKey: ohos-sdk-$VER"

      - name: Restore SDK cache
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: .sdk-cache/ohos-sdk.tar.gz
          key: ohos-sdk-${{ steps.sdk.outputs.ver }}

      - name: Download OHOS SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .sdk-cache

          curl -fL --retry 3 \
            -A "Mozilla/5.0" \
            -o .sdk-cache/ohos-sdk.tar.gz \
            "${{ steps.sdk.outputs.url }}"

          ls -lh .sdk-cache/ohos-sdk.tar.gz

      - name: Save SDK cache
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .sdk-cache/ohos-sdk.tar.gz
          key: ohos-sdk-${{ steps.sdk.outputs.ver }}

      # ============================================================
      # 5. 组装 SDK 目录
      # ============================================================

      - name: Assemble OHOS SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/ohos-sdk-unpack"

          tar -zxf .sdk-cache/ohos-sdk.tar.gz \
            -C "$HOME/ohos-sdk-unpack"

          echo "==== SDK 顶层结构 ===="
          ls -la "$HOME/ohos-sdk-unpack"

          SRC=$(find "$HOME/ohos-sdk-unpack" \
            -maxdepth 4 \
            -type f \
            -name "native-linux-x64-*.zip" \
            -printf '%h\n' | head -1)

          if [ -z "$SRC" ]; then
            SRC=$(find "$HOME/ohos-sdk-unpack" \
              -maxdepth 4 \
              -type d \
              -name native \
              -printf '%h\n' | head -1)
          fi

          if [ -z "$SRC" ]; then
            echo "::error::未找到 native SDK 组件"
            exit 1
          fi

          echo "组件目录: $SRC"

          cd "$SRC"

          for z in \
            native-linux-x64-*.zip \
            toolchains-linux-x64-*.zip \
            ets-linux-x64-*.zip \
            js-linux-x64-*.zip
          do
            if [ -e "$z" ]; then
              unzip -q -o "$z"
            fi
          done

          for d in native toolchains ets js; do
            if [ ! -d "$d" ]; then
              echo "::error::缺少 SDK 组件: $d"
              exit 1
            fi
          done

          # DevEco 风格目录
          OHOS="$HOME/ohos-sdk"

          mkdir -p "$OHOS/default/openharmony"

          mv native toolchains ets js "$OHOS/default/openharmony/"

          for d in ets js native toolchains; do
            ln -sfn "openharmony/$d" "$OHOS/default/$d"
          done

          # 检测 API 版本
          API=$(jq -r '.apiVersion // empty' \
            "$OHOS/default/openharmony/toolchains/oh-uni-package.json" \
            2>/dev/null || true)

          if [ -z "$API" ]; then
            API=$(jq -r '.apiVersion // empty' \
              "$OHOS/default/openharmony/toolchains/package.json" \
              2>/dev/null || true)
          fi

          if [ -z "$API" ]; then
            API=26
          fi

          echo "检测到 SDK API: $API"

          # 当前工作流按 API 26 对应的 6.0.0 版本格式配置
          SDK_VERSION="6.0.0 ($API)"

          echo "OHOS_API=$API" >> "$GITHUB_ENV"
          echo "OHOS_SDK_VERSION=$SDK_VERSION" >> "$GITHUB_ENV"

          ln -sfn default "$OHOS/$API"

          mkdir -p "$OHOS/openharmony"
          ln -sfn ../default/openharmony "$OHOS/openharmony/$API"

          mkdir -p "$OHOS/licenses"

          # Flutter tools 使用的 SDK 目录
          HOS="$HOME/hos-sdk-root"

          mkdir -p "$HOS/$API"

          for d in ets js native toolchains; do
            cp -a "$OHOS/default/openharmony/$d" "$HOS/$API/$d"
          done

          ln -sfn "$API" "$HOS/default"

          mkdir -p "$HOS/licenses"

          echo "==== SDK 目录检查 ===="
          ls -la "$OHOS"
          ls -la "$HOS"

          echo "OHOS_SDK_HOME=$HOS" >> "$GITHUB_ENV"
          echo "HOS_SDK_HOME=$OHOS" >> "$GITHUB_ENV"
          echo "DEVECO_SDK_HOME=$OHOS" >> "$GITHUB_ENV"
          echo "HDC_HOME=$OHOS/default/openharmony/toolchains" >> "$GITHUB_ENV"

          echo "$OHOS/default/openharmony/toolchains" >> "$GITHUB_PATH"

      # ============================================================
      # 6. 修复 build-profile.json5
      # ============================================================

      - name: Fix HarmonyOS build-profile.json5
        shell: bash
        run: |
          set -euo pipefail

          PROFILE="samples/${{ inputs.sample_dir }}/ohos/build-profile.json5"

          API="${OHOS_API:-}"
          SDK_VERSION="${OHOS_SDK_VERSION:-}"

          if [ ! -f "$PROFILE" ]; then
            echo "::error::找不到工程配置文件: $PROFILE"
            exit 1
          fi

          if [ -z "$API" ] || [ -z "$SDK_VERSION" ]; then
            echo "::error::OHOS SDK 版本未正确设置"
            exit 1
          fi

          echo "SDK API: $API"
          echo "SDK Version: $SDK_VERSION"

          python3 -m venv "$RUNNER_TEMP/json5-env"

          "$RUNNER_TEMP/json5-env/bin/pip" install json5

          "$RUNNER_TEMP/json5-env/bin/python" - \
            "$PROFILE" "$SDK_VERSION" <<'PY'
          import json5
          import sys

          path = sys.argv[1]
          sdk_version = sys.argv[2]

          with open(path, "r", encoding="utf-8") as f:
              config = json5.load(f)

          app = config.get("app")

          if not isinstance(app, dict):
              raise SystemExit("错误：缺少 app 配置")

          products = app.get("products")

          if not isinstance(products, list) or not products:
              raise SystemExit("错误：app.products 不存在或为空")

          default_found = False

          for product in products:
              if not isinstance(product, dict):
                  raise SystemExit("错误：发现无效 Product 配置")

              name = product.get("name")

              if name == "default":
                  default_found = True

              product["compileSdkVersion"] = sdk_version

              if not product.get("compatibleSdkVersion"):
                  product["compatibleSdkVersion"] = sdk_version

              print(
                  f"Product: {name}, "
                  f"compileSdkVersion: {product['compileSdkVersion']}, "
                  f"compatibleSdkVersion: {product['compatibleSdkVersion']}"
              )

          if not default_found:
              raise SystemExit("错误：缺少 default Product")

          with open(path, "w", encoding="utf-8") as f:
              json5.dump(config, f, indent=2, ensure_ascii=False)
              f.write("\n")

          with open(path, "r", encoding="utf-8") as f:
              verified = json5.load(f)

          for product in verified["app"]["products"]:
              assert product.get("compileSdkVersion") == sdk_version
              assert product.get("compatibleSdkVersion")

          print("build-profile.json5 修复成功")
          PY

          echo "==== 最终配置 ===="
          cat "$PROFILE"

      # ============================================================
      # 7. Bootstrap 官方 Hvigor 启动链
      # ============================================================

      - name: Bootstrap hvigorw
        shell: bash
        run: |
          set -euo pipefail

          DEST="samples/${{ inputs.sample_dir }}/ohos"

          if [ ! -d "$DEST" ]; then
            echo "::error::找不到 HarmonyOS 工程目录"
            exit 1
          fi

          echo "==== 原有 Hvigor 配置 ===="
          ls -la "$DEST/hvigor/" || true

          # 获取官方示例启动链
          SRC_PROJ="code/SuperFeature/Widget/ArkTSCard/CanvasGame"

          rm -rf /tmp/asamples

          git clone --depth 1 --filter=blob:none --sparse \
            https://gitee.com/southbridge/applications_app_samples.git \
            /tmp/asamples

          git -C /tmp/asamples sparse-checkout set "$SRC_PROJ"

          SRC="/tmp/asamples/$SRC_PROJ"

          if [ ! -d "$SRC/hvigor" ] || [ ! -f "$SRC/hvigorw" ]; then
            echo "::error::官方示例中缺少 Hvigor 启动文件"
            exit 1
          fi

          echo "==== 官方 Hvigor 目录 ===="
          ls -la "$SRC/hvigor"

          # 完整替换 hvigor 目录
          mkdir -p "$DEST/hvigor"

          rm -rf "$DEST/hvigor/"*

          cp -a "$SRC/hvigor/." "$DEST/hvigor/"

          cp "$SRC/hvigorw" "$DEST/hvigorw"

          chmod +x "$DEST/hvigorw"

          # 检查 pnpm 版本
          echo "==== 检查 pnpm 版本 ===="

          FOUND=0

          for f in \
            "$DEST/hvigor/hvigor-wrapper.js" \
            "$DEST/hvigorw"
          do
            if [ -f "$f" ] && grep -q '7\.30\.0' "$f"; then
              sed -i 's/7\.30\.0/9.15.9/g' "$f"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo "已将 pnpm 7.30.0 替换为 9.15.9"
          else
            echo "::warning::未找到 pnpm 7.30.0，保留官方启动器配置"
          fi

          echo "==== pnpm 配置 ===="

          grep -n -E 'pnpm|7\.30\.0|9\.15\.9' \
            "$DEST/hvigor/hvigor-wrapper.js" \
            "$DEST/hvigorw" || true

          # 检查 JS 语法
          if [ -f "$DEST/hvigor/hvigor-wrapper.js" ]; then
            node --check "$DEST/hvigor/hvigor-wrapper.js"
          fi

          echo "==== Bootstrap 完成 ===="
          ls -la "$DEST/hvigorw"
          ls -la "$DEST/hvigor/"

      # ============================================================
      # 8. 统一升级 Hvigor 配置
      # 必须放在 Bootstrap 之后
      # ============================================================

      - name: Upgrade Hvigor Config
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="samples/${{ inputs.sample_dir }}/ohos"

          PYTHON="$RUNNER_TEMP/json5-env/bin/python"

          if [ ! -x "$PYTHON" ]; then
            echo "::error::JSON5 Python 环境不存在"
            exit 1
          fi

          "$PYTHON" - "$PROJECT" <<'PY'
          import json5
          import sys
          from pathlib import Path

          project = Path(sys.argv[1])

          config_file = project / "hvigor/hvigor-config.json5"

          if not config_file.exists():
              raise SystemExit(f"找不到 Hvigor 配置: {config_file}")

          with config_file.open(encoding="utf-8") as f:
              config = json5.load(f)

          # 统一 Hvigor 版本
          config["hvigorVersion"] = "6.26.9"

          config.setdefault("dependencies", {})[
              "@ohos/hvigor-ohos-plugin"
          ] = "6.26.9"

          config.setdefault("properties", {})[
              "hvigor.dependency.useNpm"
          ] = True

          with config_file.open("w", encoding="utf-8") as f:
              json5.dump(config, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print("Hvigor 配置已更新")
          print(json5.dumps(config, indent=2, ensure_ascii=False))
          PY

      # ============================================================
      # 9. 验证 Hvigor 配置
      # ============================================================

      - name: Verify Hvigor Config
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="samples/${{ inputs.sample_dir }}/ohos"
          cd "$PROJECT"

          echo "===== Hvigor 配置 ====="
          cat hvigor/hvigor-config.json5

          echo "===== 检查 Hvigor 配置 ====="

          "$RUNNER_TEMP/json5-env/bin/python" <<'PY'
          import json5

          path = "hvigor/hvigor-config.json5"

          with open(path, encoding="utf-8") as f:
              config = json5.load(f)

          expected_version = "6.26.9"

          actual_version = config.get("hvigorVersion")
          actual_plugin = config.get("dependencies", {}).get(
              "@ohos/hvigor-ohos-plugin"
          )

          print("Hvigor:", actual_version)
          print("Plugin:", actual_plugin)

          if actual_version != expected_version:
              raise SystemExit("Hvigor 版本不匹配")

          if actual_plugin != expected_version:
              raise SystemExit("Hvigor 插件版本不匹配")

          print("Hvigor 配置检查通过")
          PY

      # ============================================================
      # 10. 检查启动器及依赖解析
      # ============================================================

      - name: Verify Hvigor Dependencies
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="samples/${{ inputs.sample_dir }}/ohos"

          cd "$PROJECT"

          echo "===== Node ====="
          node -v

          echo "===== npm ====="
          npm -v

          echo "===== ohpm ====="
          ohpm --version || true

          echo "===== Hvigor 启动器 ====="
          ls -la hvigorw

          echo "===== Hvigor 实际版本 ====="
          ./hvigorw --version

          echo "===== 项目插件安装情况 ====="

          find . \
            -path '*/node_modules/@ohos/hvigor-ohos-plugin/package.json' \
            -print 2>/dev/null || true

          echo "===== Hvigor 相关配置 ====="

          grep -R -n -E \
            '"@ohos/hvigor"|"@ohos/hvigor-ohos-plugin"|3\.0\.2|6\.26\.9' \
            --include='*.json5' \
            --include='*.json' \
            --include='*.yaml' \
            --include='*.yml' \
            . | head -100 || true

      # ============================================================
      # 11. 构建 HAP
      # ============================================================

      - name: Build HAP (unsigned)
        shell: bash
        working-directory: samples/${{ inputs.sample_dir }}
        run: |
          set -euo pipefail

          # 工程自带 Hvigor 启动器
          if [ -f ohos/hvigorw ]; then
            chmod +x ohos/hvigorw
            export PATH="$PWD/ohos:$PATH"

            echo "使用工程 Hvigor 启动器:"
            command -v hvigorw
          else
            echo "::error::工程中缺少 ohos/hvigorw"
            exit 1
          fi

          # Flutter OHOS SDK
          export PATH="$GITHUB_WORKSPACE/flutter_flutter/bin:$PATH"

          echo "==== 环境变量 ===="
          echo "OHOS_SDK_HOME=$OHOS_SDK_HOME"
          echo "HOS_SDK_HOME=$HOS_SDK_HOME"
          echo "OHOS_API=$OHOS_API"
          echo "OHOS_SDK_VERSION=$OHOS_SDK_VERSION"

          echo "==== Hvigor 自检 ===="
          hvigorw --version

          echo "==== Flutter 版本 ===="
          flutter --version

          echo "==== Flutter Doctor ===="
          flutter doctor -v || true

          echo "==== Pub Get ===="
          flutter pub get

          export CI=false
          export npm_config_frozen_lockfile=false
          export NPM_CONFIG_FROZEN_LOCKFILE=false

          echo "==== 开始构建 HAP ===="

          flutter build hap \
            --release \
            --no-codesign \
            --target-platform "${{ inputs.target_platform }}" \
            -v

      # ============================================================
      # 12. 收集 Hvigor 日志
      # ============================================================

      - name: Collect Hvigor Logs
        if: always()
        shell: bash
        run: |
          echo "========== Node =========="
          node --version || true

          echo "========== Hvigor log files =========="

          if [ ! -d "$HOME/.hvigor" ]; then
            echo "Hvigor 日志目录不存在：$HOME/.hvigor"
            exit 0
          fi

          find "$HOME/.hvigor" \
            -path '*/node_modules' -prune -o \
            -type f \( -name '*.log' -o -name 'hvigor*.txt' \) \
            -mmin -30 -print 2>/dev/null |
          while read -r file; do
            echo "========== $file =========="
            tail -n 150 "$file" || true
          done

      # ============================================================
      # 13. 上传 HAP
      # ============================================================

      - name: Upload HAP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.sample_dir }}-hap
          path: samples/${{ inputs.sample_dir }}/**/build/ohos/hap/*.hap
          if-no-files-found: error
