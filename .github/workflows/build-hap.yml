name: Build OHOS HAP from GitCode

on:
  workflow_dispatch:
    inputs:
      sample_dir:
        description: "示例目录名，如 flutter_music_player / channel_demo"
        required: true
        default: "flutter_music_player"
      samples_branch:
        description: "samples 分支"
        default: "master"
      target_platform:
        description: "目标架构：ohos-x64（DevEco 模拟器）/ ohos-arm64（真机）"
        default: "ohos-x64"
      flutter_ref:
        description: "flutter_flutter 分支/标签"
        default: "oh-3.41.9-release"
      clt_release_tag:
        description: "本仓库 Release 中存放 Command Line Tools zip 的标签"
        default: "clt-26"

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
  FLUTTER_OHOS_STORAGE_BASE_URL: https://flutter-ohos.obs.cn-south-1.myhuaweicloud.com
  FLUTTER_GIT_URL: https://gitcode.com/CPF-Flutter/flutter_flutter.git

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ============================================================
      # 1. 获取源码
      # ============================================================

      - name: Clone flutter_samples (GitCode)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 -b "${{ inputs.samples_branch }}" \
            https://gitcode.com/CPF-Flutter/flutter_samples.git samples

      - name: Clone flutter_flutter (GitCode)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 -b "${{ inputs.flutter_ref }}" \
            https://gitcode.com/CPF-Flutter/flutter_flutter.git flutter_flutter

      # ============================================================
      # 2. 修补 Flutter OHOS SDK 校验（必须在任何 Flutter 命令之前）
      # ============================================================

      - name: Patch flutter_tools SDK validation
        shell: bash
        run: |
          set -euo pipefail

          F="flutter_flutter/packages/flutter_tools/lib/src/ohos/ohos_sdk.dart"

          echo "==== 补丁前 ===="
          grep -n "static bool valid" "$F" || true

          awk '
            /static bool valid(SdkDirectory|Api1[01]SdkDirectory)/ {
              print
              print "    return true; // CI patch: bypass strict SDK dir check"
              next
            }
            { print }
          ' "$F" > "$F.tmp"

          mv "$F.tmp" "$F"

          echo "==== 补丁后 ===="
          grep -n "CI patch" "$F" || true

          COUNT=$(grep -c "CI patch" "$F" || true)
          echo "注入数量: $COUNT"

          if [ "$COUNT" -lt 4 ]; then
            echo "::error::SDK 校验补丁未完整命中"
            exit 1
          fi

      # ============================================================
      # 3. 基础环境
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 华为文档：Command Line Tools 26.0.0 及以上推荐 JDK 21
          java-version: "21"

      # ============================================================
      # 4. 安装华为 Command Line Tools
      #    自带 hvigor、@ohos/hvigor-ohos-plugin、ohpm、node
      #    需要先把 zip 上传到本仓库（私有）的 Release
      # ============================================================


      - name: Install Command Line Tools
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "==== 下载 CLT ZIP 分卷 ===="

          gh release download "${{ inputs.clt_release_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern 'commandline-tools-linux-x64-*.zip.*' \
            --dir "$RUNNER_TEMP"

          echo "==== 检查分卷 ===="

          mapfile -t PARTS < <(
            find "$RUNNER_TEMP" \
              -maxdepth 1 \
              -type f \
              -name 'commandline-tools-linux-x64-*.zip.[0-9][0-9][0-9]' \
              | sort -V
          )

          if [ "${#PARTS[@]}" -eq 0 ]; then
            echo "::error::没有找到 CLT ZIP 分卷"
            ls -lh "$RUNNER_TEMP"
            exit 1
          fi

          printf '%s\n' "${PARTS[@]}"

          # 检查首个分卷
          FIRST="${PARTS[0]}"

          if [[ ! "$FIRST" =~ \.001$ ]]; then
            echo "::error::第一个分卷不是 .001"
            exit 1
          fi

          ZIP="${FIRST%.001}"

          # 检查分卷是否连续
          for i in "${!PARTS[@]}"; do
            EXPECTED="${ZIP}.$(printf '%03d' "$((i + 1))")"

            if [ "${PARTS[$i]}" != "$EXPECTED" ]; then
              echo "::error::分卷缺失或顺序错误: $EXPECTED"
              exit 1
            fi
          done

          echo "分卷数量: ${#PARTS[@]}"

          # 合并 ZIP
          echo "==== 合并 ZIP ===="

          cat "${PARTS[@]}" > "$ZIP"

          ls -lh "$ZIP"

          # 检查 ZIP 完整性
          echo "==== 验证 ZIP ===="

          unzip -tq "$ZIP"

          echo "ZIP 验证成功"

          # 解压 CLT
          echo "==== 解压 Command Line Tools ===="

          mkdir -p "$HOME/clt"
          unzip -q "$ZIP" -d "$HOME/clt"

          CLT="$HOME/clt/command-line-tools"

          if [ ! -d "$CLT" ]; then
            echo "::error::解压后未找到 command-line-tools 目录"
            ls -la "$HOME/clt"
            exit 1
          fi

          chmod +x "$CLT"/bin/* || true
          chmod +x "$CLT"/tool/node/bin/* || true

          {
            echo "COMMANDLINE_TOOL_DIR=$CLT"
            echo "NODE_HOME=$CLT/tool/node"
          } >> "$GITHUB_ENV"

          {
            echo "$CLT/bin"
            echo "$CLT/tool/node/bin"
          } >> "$GITHUB_PATH"

          echo "==== CLT 目录 ===="
          ls -la "$CLT"

          echo "==== CLT/bin ===="
          ls -la "$CLT/bin"


      - name: Configure npm registry
        shell: bash
        run: |
          set -euo pipefail
          npm config set registry https://repo.huaweicloud.com/repository/npm/
          npm config set "@ohos:registry" https://repo.harmonyos.com/npm/
          npm config get registry
          npm config get "@ohos:registry"

      - name: Check CLT tools
        shell: bash
        run: |
          set -euo pipefail
          echo "==== node ===="
          node -v
          echo "==== ohpm ===="
          ohpm --version
          echo "==== hvigorw ===="
          which hvigorw

      # ============================================================
      # 5. 获取并组装 OpenHarmony SDK（沿用之前已跑通的流程）
      # ============================================================

      - name: Query OHOS SDK URL
        id: sdk
        shell: bash
        run: |
          set -euo pipefail

          query_component() {
            local component="$1"

            curl -fsSL \
              'https://dcp.openharmony.cn/api/daily_build/build/list/component' \
              -H 'Accept: application/json, text/plain, */*' \
              -H 'Content-Type: application/json' \
              --data-raw '{
                "projectName":"openharmony",
                "branch":"master",
                "pageNum":1,
                "pageSize":10,
                "deviceLevel":"",
                "component":"'"${component}"'",
                "type":1,
                "startTime":"2025010100000000",
                "endTime":"20990101235959",
                "sortType":"",
                "sortField":"",
                "hardwareBoard":"",
                "buildStatus":"success",
                "buildFailReason":"",
                "withDomain":1
              }'
          }

          query_component "ohos-sdk-public" > /tmp/pub.json

          URL=$(jq -r '.data.list.dataList[0].obsPath // empty' /tmp/pub.json)

          if [ -z "$URL" ]; then
            query_component "ohos-sdk-full" > /tmp/full.json
            URL=$(jq -r '.data.list.dataList[0].obsPath // empty' /tmp/full.json)
          fi

          if [ -z "$URL" ]; then
            echo "::error::未能解析出 SDK 下载地址"
            exit 1
          fi

          VER=$(echo "$URL" |
            sed -E 's|.*/Daily_Version/||; s|/[^/]+$||; s|/|_|g')

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

          echo "SDK URL: $URL"
          echo "CacheKey: ohos-sdk-$VER"

      - name: Restore SDK cache
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: .sdk-cache/ohos-sdk.tar.gz
          key: ohos-sdk-${{ steps.sdk.outputs.ver }}

      - name: Download OHOS SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .sdk-cache

          curl -fL --retry 3 \
            -A "Mozilla/5.0" \
            -o .sdk-cache/ohos-sdk.tar.gz \
            "${{ steps.sdk.outputs.url }}"

          ls -lh .sdk-cache/ohos-sdk.tar.gz

      - name: Save SDK cache
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .sdk-cache/ohos-sdk.tar.gz
          key: ohos-sdk-${{ steps.sdk.outputs.ver }}

      - name: Assemble OHOS SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/ohos-sdk-unpack"

          tar -zxf .sdk-cache/ohos-sdk.tar.gz \
            -C "$HOME/ohos-sdk-unpack"

          echo "==== SDK 顶层结构 ===="
          ls -la "$HOME/ohos-sdk-unpack"

          SRC=$(find "$HOME/ohos-sdk-unpack" \
            -maxdepth 4 \
            -type f \
            -name "native-linux-x64-*.zip" \
            -printf '%h\n' | head -1)

          if [ -z "$SRC" ]; then
            SRC=$(find "$HOME/ohos-sdk-unpack" \
              -maxdepth 4 \
              -type d \
              -name native \
              -printf '%h\n' | head -1)
          fi

          if [ -z "$SRC" ]; then
            echo "::error::未找到 native SDK 组件"
            exit 1
          fi

          echo "组件目录: $SRC"

          cd "$SRC"

          for z in \
            native-linux-x64-*.zip \
            toolchains-linux-x64-*.zip \
            ets-linux-x64-*.zip \
            js-linux-x64-*.zip
          do
            if [ -e "$z" ]; then
              unzip -q -o "$z"
            fi
          done

          for d in native toolchains ets js; do
            if [ ! -d "$d" ]; then
              echo "::error::缺少 SDK 组件: $d"
              exit 1
            fi
          done

          # DevEco 风格目录
          OHOS="$HOME/ohos-sdk"

          mkdir -p "$OHOS/default/openharmony"

          mv native toolchains ets js "$OHOS/default/openharmony/"

          for d in ets js native toolchains; do
            ln -sfn "openharmony/$d" "$OHOS/default/$d"
          done

          # 检测 API 版本
          API=$(jq -r '.apiVersion // empty' \
            "$OHOS/default/openharmony/toolchains/oh-uni-package.json" \
            2>/dev/null || true)

          if [ -z "$API" ]; then
            API=$(jq -r '.apiVersion // empty' \
              "$OHOS/default/openharmony/toolchains/package.json" \
              2>/dev/null || true)
          fi

          if [ -z "$API" ]; then
            API=26
          fi

          echo "检测到 SDK API: $API"

          SDK_VERSION="6.0.0 ($API)"

          echo "OHOS_API=$API" >> "$GITHUB_ENV"
          echo "OHOS_SDK_VERSION=$SDK_VERSION" >> "$GITHUB_ENV"

          ln -sfn default "$OHOS/$API"

          mkdir -p "$OHOS/openharmony"
          ln -sfn ../default/openharmony "$OHOS/openharmony/$API"

          mkdir -p "$OHOS/licenses"

          # Flutter tools 使用的 SDK 目录
          HOS="$HOME/hos-sdk-root"

          mkdir -p "$HOS/$API"

          for d in ets js native toolchains; do
            cp -a "$OHOS/default/openharmony/$d" "$HOS/$API/$d"
          done

          ln -sfn "$API" "$HOS/default"

          mkdir -p "$HOS/licenses"

          echo "==== SDK 目录检查 ===="
          ls -la "$OHOS"
          ls -la "$HOS"

          echo "OHOS_SDK_HOME=$HOS" >> "$GITHUB_ENV"
          echo "HOS_SDK_HOME=$OHOS" >> "$GITHUB_ENV"
          echo "DEVECO_SDK_HOME=$OHOS" >> "$GITHUB_ENV"
          echo "HDC_HOME=$OHOS/default/openharmony/toolchains" >> "$GITHUB_ENV"

          echo "$OHOS/default/openharmony/toolchains" >> "$GITHUB_PATH"

      # ============================================================
      # 6. 修复 build-profile.json5
      # ============================================================

      - name: Fix HarmonyOS build-profile.json5
        shell: bash
        run: |
          set -euo pipefail

          PROFILE="samples/${{ inputs.sample_dir }}/ohos/build-profile.json5"

          API="${OHOS_API:-}"
          SDK_VERSION="${OHOS_SDK_VERSION:-}"

          if [ ! -f "$PROFILE" ]; then
            echo "::error::找不到工程配置文件: $PROFILE"
            exit 1
          fi

          if [ -z "$API" ] || [ -z "$SDK_VERSION" ]; then
            echo "::error::OHOS SDK 版本未正确设置"
            exit 1
          fi

          echo "SDK API: $API"
          echo "SDK Version: $SDK_VERSION"

          python3 -m venv "$RUNNER_TEMP/json5-env"
          "$RUNNER_TEMP/json5-env/bin/pip" install json5

          "$RUNNER_TEMP/json5-env/bin/python" - \
            "$PROFILE" "$SDK_VERSION" <<'PY'
          import json5
          import sys

          path = sys.argv[1]
          sdk_version = sys.argv[2]

          with open(path, "r", encoding="utf-8") as f:
              config = json5.load(f)

          app = config.get("app")

          if not isinstance(app, dict):
              raise SystemExit("错误：缺少 app 配置")

          products = app.get("products")

          if not isinstance(products, list) or not products:
              raise SystemExit("错误：app.products 不存在或为空")

          default_found = False

          for product in products:
              if not isinstance(product, dict):
                  raise SystemExit("错误：发现无效 Product 配置")

              name = product.get("name")

              if name == "default":
                  default_found = True

              product["compileSdkVersion"] = sdk_version

              if not product.get("compatibleSdkVersion"):
                  product["compatibleSdkVersion"] = sdk_version

              print(
                  f"Product: {name}, "
                  f"compileSdkVersion: {product['compileSdkVersion']}, "
                  f"compatibleSdkVersion: {product['compatibleSdkVersion']}"
              )

          if not default_found:
              raise SystemExit("错误：缺少 default Product")

          with open(path, "w", encoding="utf-8") as f:
              json5.dump(config, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print("build-profile.json5 修复成功")
          PY

          echo "==== 最终配置 ===="
          cat "$PROFILE"

      # ============================================================
      # 7. 让工程使用 CLT 的 hvigor
      #    - 从 hvigor-config.json5 的 dependencies 移除
      #      @ohos/hvigor 和 @ohos/hvigor-ohos-plugin（华为文档要求）
      #    - 把 ohos/hvigorw 替换为转发到 CLT hvigorw 的小脚本，
      #      这样 flutter build hap 调用时用的就是自带插件的 hvigor
      # ============================================================

      - name: Use CLT hvigor in project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="samples/${{ inputs.sample_dir }}/ohos"

          if [ ! -d "$PROJECT" ]; then
            echo "::error::找不到 HarmonyOS 工程目录: $PROJECT"
            exit 1
          fi

          echo "==== 工程原有 hvigor 目录 ===="
          ls -la "$PROJECT/hvigor" || true
          echo "==== 原有 hvigor-config.json5 ===="
          cat "$PROJECT/hvigor/hvigor-config.json5" || true

          "$RUNNER_TEMP/json5-env/bin/python" - "$PROJECT" <<'PY'
          import json5
          import sys
          from pathlib import Path

          p = Path(sys.argv[1]) / "hvigor" / "hvigor-config.json5"

          if not p.exists():
              print("未找到 hvigor-config.json5，跳过清理")
              raise SystemExit(0)

          with p.open(encoding="utf-8") as f:
              cfg = json5.load(f)

          deps = cfg.get("dependencies")
          removed = []

          if isinstance(deps, dict):
              for k in ("@ohos/hvigor", "@ohos/hvigor-ohos-plugin"):
                  if k in deps:
                      deps.pop(k)
                      removed.append(k)

          if removed:
              with p.open("w", encoding="utf-8") as f:
                  json5.dump(cfg, f, indent=2, ensure_ascii=False)
                  f.write("\n")
              print("已从 dependencies 移除:", removed)
          else:
              print("dependencies 中没有需要移除的内置插件")
          PY

          # 备份并替换工程自带的 hvigorw
          if [ -f "$PROJECT/hvigorw" ]; then
            mv "$PROJECT/hvigorw" "$PROJECT/hvigorw.orig"
          fi

          cat > "$PROJECT/hvigorw" <<'SH'
          #!/usr/bin/env bash
          exec "$COMMANDLINE_TOOL_DIR/bin/hvigorw" "$@"
          SH

          chmod +x "$PROJECT/hvigorw"

          echo "==== 清理后的 hvigor-config.json5 ===="
          cat "$PROJECT/hvigor/hvigor-config.json5" || true

          echo "==== hvigorw 自检（在 ohos 目录内执行）===="
          (cd "$PROJECT" && ./hvigorw --version)

      # ============================================================
      # 8. 构建 HAP
      # ============================================================

      - name: Build HAP (unsigned)
        shell: bash
        working-directory: samples/${{ inputs.sample_dir }}
        run: |
          set -euo pipefail

          export PATH="$GITHUB_WORKSPACE/flutter_flutter/bin:$PATH"

          echo "==== 环境变量 ===="
          echo "OHOS_SDK_HOME=$OHOS_SDK_HOME"
          echo "HOS_SDK_HOME=$HOS_SDK_HOME"
          echo "DEVECO_SDK_HOME=$DEVECO_SDK_HOME"
          echo "OHOS_API=$OHOS_API"
          echo "OHOS_SDK_VERSION=$OHOS_SDK_VERSION"
          echo "COMMANDLINE_TOOL_DIR=$COMMANDLINE_TOOL_DIR"

          echo "==== Flutter 对 hvigorw 的查找逻辑（排查用）===="
          grep -n "hvigorw" \
            "$GITHUB_WORKSPACE/flutter_flutter/packages/flutter_tools/lib/src/ohos/hvigor.dart" \
            | head -30 || true

          echo "==== Flutter 版本 ===="
          flutter --version

          echo "==== Flutter Doctor ===="
          flutter doctor -v || true

          echo "==== Pub Get ===="
          flutter pub get

          export CI=false

          echo "==== 开始构建 HAP ===="
          flutter build hap \
            --release \
            --no-codesign \
            --target-platform "${{ inputs.target_platform }}" \
            -v

      # ============================================================
      # 9. 收集 Hvigor 日志
      # ============================================================

      - name: Collect Hvigor Logs
        if: always()
        shell: bash
        run: |
          echo "========== Node =========="
          node --version || true

          echo "========== Hvigor log files =========="

          if [ ! -d "$HOME/.hvigor" ]; then
            echo "Hvigor 日志目录不存在：$HOME/.hvigor"
            exit 0
          fi

          find "$HOME/.hvigor" \
            -path '*/node_modules' -prune -o \
            -type f \( -name '*.log' -o -name 'hvigor*.txt' \) \
            -mmin -30 -print 2>/dev/null |
          while read -r file; do
            echo "========== $file =========="
            tail -n 150 "$file" || true
          done

      # ============================================================
      # 10. 上传 HAP
      # ============================================================

      - name: Upload HAP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.sample_dir }}-hap
          path: samples/${{ inputs.sample_dir }}/**/build/ohos/hap/*.hap
          if-no-files-found: error
