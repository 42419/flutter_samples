name: Build OHOS HAP from GitCode

on:
  workflow_dispatch:
    inputs:
      sample_dir:
        description: '示例目录名，如 flutter_music_player / channel_demo'
        required: true
        default: 'flutter_music_player'
      samples_branch:
        description: 'samples 分支'
        default: 'master'
      flutter_ref:
        description: 'flutter_flutter 分支/标签'
        default: 'oh-3.41.9-release'

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://flutter-ohos.obs.cn-south-1.myhuaweicloud.com

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # ========== 1. 拉源码 ==========
      - name: Clone flutter_samples (GitCode)
        run: |
          git clone --depth 1 -b ${{ inputs.samples_branch }} \
            https://gitcode.com/CPF-Flutter/flutter_samples.git samples

      - name: Clone flutter_flutter (GitCode)
        run: |
          git clone --depth 1 -b ${{ inputs.flutter_ref }} \
            https://gitcode.com/CPF-Flutter/flutter_flutter.git flutter_flutter

      # ========== 2. 基础工具 ==========
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '18' }

      # ========== 3. 安装 OpenHarmony SDK（动态查询最新公共版）==========
      - name: Install OpenHarmony SDK
        run: |
          set -euo pipefail

          # 1. 查询 DCP 日构建组件列表（完整参数版）
          query_component() {
            component=$1
            curl -fsSL 'https://dcp.openharmony.cn/api/daily_build/build/list/component' \
              -H 'Accept: application/json, text/plain, */*' \
              -H 'Content-Type: application/json' \
              --data-raw '{
                "projectName":"openharmony",
                "branch":"master",
                "pageNum":1,
                "pageSize":10,
                "deviceLevel":"",
                "component":"'"${component}"'",
                "type":1,
                "startTime":"2025010100000000",
                "endTime":"20990101235959",
                "sortType":"",
                "sortField":"",
                "hardwareBoard":"",
                "buildStatus":"success",
                "buildFailReason":"",
                "withDomain":1
              }'
          }

          query_component "ohos-sdk-public" > /tmp/pub.json
          echo "==== ohos-sdk-public 返回(前 1500 字节) ===="; head -c 1500 /tmp/pub.json; echo

          SDK_URL=$(jq -r '.data.list.dataList[0].obsPath // empty' /tmp/pub.json)

          # public 查不到就试 full
          if [ -z "$SDK_URL" ]; then
            query_component "ohos-sdk-full" > /tmp/full.json
            echo "==== ohos-sdk-full 返回(前 1500 字节) ===="; head -c 1500 /tmp/full.json; echo
            SDK_URL=$(jq -r '.data.list.dataList[0].obsPath // empty' /tmp/full.json)
          fi

          echo "解析到的下载地址: $SDK_URL"
          [ -n "$SDK_URL" ] || { echo "::error::未能解析出 SDK 地址"; exit 1; }

          # 2. 下载
          curl -fL --retry 3 -A "Mozilla/5.0" -o /tmp/ohos-sdk.tar.gz "$SDK_URL"
          ls -lh /tmp/ohos-sdk.tar.gz

          # 3. 解压组装（自动探测目录结构，兼容 7.x 新包布局）
          mkdir -p $HOME/ohos-sdk-unpack
          tar -zxf /tmp/ohos-sdk.tar.gz -C $HOME/ohos-sdk-unpack
          echo "==== 解压后顶层结构 ===="
          ls -la $HOME/ohos-sdk-unpack

          # 找 native 组件 zip 所在目录；若包里已是解压好的目录则找 native/ 目录
          SRC=$(find $HOME/ohos-sdk-unpack -maxdepth 3 -type f -name "native-linux-x64-*.zip" -printf '%h\n' | head -1)
          if [ -z "$SRC" ]; then
            SRC=$(find $HOME/ohos-sdk-unpack -maxdepth 4 -type d -name native -printf '%h\n' | head -1)
          fi
          [ -n "$SRC" ] || { echo "::error::未找到 native 组件，包结构未知"; exit 1; }
          echo "组件所在目录: $SRC"
          cd "$SRC"
          ls -la

          # 若是 zip 形式则解压
          for z in native-linux-x64-*.zip toolchains-linux-x64-*.zip ets-linux-x64-*.zip js-linux-x64-*.zip; do
            [ -e "$z" ] && unzip -q -o "$z" || true
          done

          # 校验四个组件目录齐全
          for d in native toolchains ets js; do
            [ -d "$d" ] || { echo "::error::缺少组件目录: $d（当前目录内容见上方 ls）"; exit 1; }
          done

          OHOS=$HOME/ohos-sdk
          mkdir -p $OHOS/default/openharmony
          mv native toolchains ets js $OHOS/default/openharmony/
          API=$(jq -r '.apiVersion // empty' $OHOS/default/openharmony/toolchains/oh-uni-package.json || true)
          echo "检测到 SDK API 版本: $API"
          echo "OHOS_API=$API" >> $GITHUB_ENV
          [ -n "$API" ] && mkdir -p $OHOS/openharmony && ln -sfn ../default/openharmony $OHOS/openharmony/$API
          for d in ets js native toolchains; do ln -sfn default/openharmony/$d $OHOS/$d; done

          echo "DEVECO_SDK_HOME=$OHOS" >> $GITHUB_ENV
          echo "OHOS_SDK_HOME=$OHOS" >> $GITHUB_ENV
          echo "$OHOS/default/openharmony/toolchains" >> $GITHUB_PATH

      # ========== 4. 对齐示例 compileSdkVersion（在 build 之前）==========
      - name: 对齐示例 compileSdkVersion 到已装 SDK
        run: |
          PROFILE=samples/${{ inputs.sample_dir }}/ohos/build-profile.json5
          API="${OHOS_API:-}"
          if [ -f "$PROFILE" ] && [ -n "$API" ]; then
            sed -i -E 's/"(compile|target)SdkVersion"[[:space:]]*:[[:space:]]*"[^"]*"/"\1SdkVersion": '"$API"'/g' "$PROFILE"
            echo "==== 修改后的 build-profile.json5 ===="
            grep -n "SdkVersion" "$PROFILE" || true
          else
            echo "未找到 profile($PROFILE) 或 API 版本未知，跳过"
          fi

      # ========== 5. Flutter 进 PATH ==========
      - name: Add flutter to PATH
        run: echo "$PWD/flutter_flutter/bin" >> $GITHUB_PATH

      # ========== 6. 构建 ==========
      - name: Build HAP (unsigned)
        working-directory: samples/${{ inputs.sample_dir }}
        run: |
          flutter --version
          flutter doctor -v || true
          flutter pub get
          flutter build hap --release --no-codesign --target-platform ohos-arm64

      # ========== 7. 产物上传 ==========
      - name: Upload HAP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.sample_dir }}-hap
          path: samples/${{ inputs.sample_dir }}/**/build/ohos/hap/*.hap
          if-no-files-found: error
